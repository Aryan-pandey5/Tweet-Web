{% extends "Layout.html" %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-8 text-center">
    <div class="p-5 bg-body-tertiary rounded-4 border border-secondary-subtle shadow">
      <h1 class="display-4 fw-bold text-primary mb-3">
        <i class="bi bi-twitter-x me-2"></i>Welcome to Let Tweet
      </h1>
      <p class="lead text-secondary mb-4">
        Share your thoughts, connect with others, and explore the latest tweets from the community.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'all_tweet' %}" class="btn btn-primary btn-lg px-4">
          <i class="bi bi-card-text me-2"></i>Read Tweets
        </a>
        <a href="{% url 'add_data' %}" class="btn btn-outline-light btn-lg px-4">
          <i class="bi bi-plus-circle me-2"></i>Add Tweet
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
