{% extends "Layout.html" %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-8 col-lg-6">
    <div class="card bg-body-tertiary border-secondary-subtle shadow p-4">
      <h2 class="h4 fw-bold text-light mb-4 text-center">
        {% if form.instance.id %}
          <i class="bi bi-pencil-square text-warning me-2"></i>Edit Tweet
        {% else %}
          <i class="bi bi-plus-circle text-primary me-2"></i>Create Tweet
        {% endif %}
      </h2>

      <form method="post" class="form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-between align-items-center mt-4">
          <a href="{% url 'all_tweet' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back
          </a>
          <button type="submit" class="btn btn-warning px-4 fw-bold">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
