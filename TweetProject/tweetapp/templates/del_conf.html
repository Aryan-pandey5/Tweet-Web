{% extends "Layout.html" %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-6 col-lg-5">
    <div class="card bg-body-tertiary border-danger-subtle shadow p-4 text-center">
      <div class="text-danger mb-3">
        <i class="bi bi-exclamation-triangle fs-1"></i>
      </div>
      <h2 class="h3 text-danger fw-bold mb-3">Are you sure?</h2>
      <p class="text-secondary mb-4">
        Are you sure you want to delete this tweet? This action cannot be undone.
      </p>

      <form method="post" class="d-flex justify-content-center gap-3">
        {% csrf_token %}
        <a href="{% url 'all_tweet' %}" class="btn btn-outline-secondary px-4">
          Cancel
        </a>
        <button type="submit" class="btn btn-danger px-4 fw-bold">
          <i class="bi bi-trash me-1"></i>Delete
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
