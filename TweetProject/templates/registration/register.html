{% extends "Layout.html" %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-7 col-lg-6">
    <div class="card bg-body-tertiary border-secondary-subtle shadow p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus fs-1 text-success"></i>
        <h2 class="h3 fw-bold text-light mt-2">Create an Account</h2>
        <p class="text-secondary small">Sign up to start sharing your tweets.</p>
      </div>

      <form method="post" class="mb-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100 py-2 fw-bold mt-2" type="submit">
          Register
        </button>
      </form>

      <div class="text-center border-top border-secondary-subtle pt-3">
        <p class="text-secondary mb-0">
          Already have an account? 
          <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">Log in here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
